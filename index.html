<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<title>Banking To-Do</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#202124;font-family:Arial,sans-serif}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:14px 16px;z-index:5}
.bar,main{max-width:760px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600}.add{background:#1a73e8;color:white}
main{padding:12px 14px 90px}.section{margin:18px 0}.section-title{font-size:14px;font-weight:bold;margin:0 0 9px}
.high .section-title{color:#d93025}.medium .section-title{color:#b06000}.low .section-title{color:#188038}.notes{display:grid;gap:9px}
.empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:15px;color:#777;font-size:14px}
.note{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:13px;box-shadow:0 1px 2px #0001}.note.done{opacity:.55}
.row{display:flex;gap:10px;align-items:flex-start}.check{width:20px;height:20px;margin-top:2px}.title{font-weight:bold;flex:1}.del{background:#f1f3f4;color:#666;padding:6px 9px}
.meta{font-size:12px;color:#777;margin:7px 0 0 30px}.fab{position:fixed;right:18px;bottom:18px;border-radius:50%;width:58px;height:58px;font-size:27px;padding:0;box-shadow:0 4px 14px #0003}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:10;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:white;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0 12px;font:inherit}
textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px}.cancel{background:#eee}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px;margin:20px}}
</style>
<link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head>
<body>
<header><div class="bar"><h1>🏦 Banking To-Do</h1><button class="add" onclick="openModal()">＋ Add Note</button></div></header>
<main>
<section class="section high"><div class="section-title">🔴 HIGH PRIORITY</div><div id="high" class="notes"></div></section>
<section class="section medium"><div class="section-title">🟡 MEDIUM PRIORITY</div><div id="medium" class="notes"></div></section>
<section class="section low"><div class="section-title">🟢 LOW PRIORITY</div><div id="low" class="notes"></div></section>
<section class="section"><div class="section-title">📅 TODAY'S TASKS</div><div id="today" class="notes"></div></section>
<section class="section"><div class="section-title">📌 NOTES</div><div id="general" class="notes"></div></section>
<section class="section"><div class="section-title">⏰ REMINDERS</div><div id="reminders" class="notes"></div></section>
<section class="section"><div class="section-title">📋 FOLLOW-UP</div><div id="followup" class="notes"></div></section>
<section class="section"><div class="section-title">✅ COMPLETED</div><div id="completed" class="notes"></div></section>
</main>
<button class="add fab" onclick="openModal()">＋</button>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
<h2>New Note</h2>
<label>Title</label><input id="title" placeholder="Enter note title">
<label>Details</label><textarea id="details" placeholder="Enter details or tasks"></textarea>
<label>Priority</label><select id="priority"><option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">🟢 Low</option></select>
<label>Category</label><select id="category"><option value="today">📅 Today's Tasks</option><option value="general">📌 Notes</option><option value="reminders">⏰ Reminders</option><option value="followup">📋 Follow-up</option></select>
<label>Due date</label><input id="due" type="date">
<label>Images</label><input id="images" type="file" accept="image/*" multiple>
<div id="imagePreview" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px"></div>
<div class="actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="add" onclick="saveNote()">Save Note</button></div>
</div></div>

<script>
const KEY="bankingTodoNotes";let notes=JSON.parse(localStorage.getItem(KEY)||"[]");
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));render()}
function openModal(){modal.classList.add("show");title.focus()}
function closeModal(){modal.classList.remove("show");title.value=details.value=due.value="";images.value="";imagePreview.innerHTML=""}
function readImages(files){
 return Promise.all([...files].map(file=>new Promise((resolve,reject)=>{
  const r=new FileReader(); r.onload=()=>resolve({name:file.name,data:r.result}); r.onerror=reject; r.readAsDataURL(file);
 })));
}
async function saveNote(){
 if(!title.value.trim())return alert("Enter a title");
 const imgs=await readImages(images.files);
 notes.push({id:Date.now(),title:title.value.trim(),details:details.value.trim(),priority:priority.value,category:category.value,due:due.value,images:imgs,done:false});
 persist();closeModal();
}
images.addEventListener("change",()=>{
 imagePreview.innerHTML=[...images.files].map(f=>`<img src="${URL.createObjectURL(f)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px">`).join("");
});
function toggle(id){let n=notes.find(x=>x.id===id);n.done=!n.done;persist()}
function removeNote(id){if(confirm("Delete this note?")){notes=notes.filter(x=>x.id!==id);persist()}}
function card(n){return '<div class="note '+(n.done?'done':'')+'"><div class="row"><input class="check" type="checkbox" '+(n.done?'checked':'')+' onchange="toggle('+n.id+')"><div class="title">'+esc(n.title)+'</div><button class="del" onclick="removeNote('+n.id+')">Delete</button></div>'+(n.details?'<div class="meta">'+esc(n.details).replace(/\n/g,"<br>")+'</div>':'') +(n.due?'<div class="meta">Due: '+new Date(n.due+"T00:00:00").toLocaleDateString()+'</div>':'')
 +(n.images&&n.images.length?'<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0 30px">'+n.images.map(i=>'<img src="'+i.data+'" style="width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid #ddd" onclick="window.open(this.src)"></div>':'')
 +'</div>'}
function fill(id,list){document.getElementById(id).innerHTML=list.length?list.map(card).join(""):'<div class="empty">No items yet</div>'}
function render(){let a=notes.filter(n=>!n.done);fill("high",a.filter(n=>n.priority==="high"));fill("medium",a.filter(n=>n.priority==="medium"));fill("low",a.filter(n=>n.priority==="low"));fill("today",a.filter(n=>n.category==="today"));fill("general",a.filter(n=>n.category==="general"));fill("reminders",a.filter(n=>n.category==="reminders"));fill("followup",a.filter(n=>n.category==="followup"));fill("completed",notes.filter(n=>n.done))}
render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body>
</html>
