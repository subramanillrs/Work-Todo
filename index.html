<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>Banking To-Do</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#202124;font-family:Arial,sans-serif}
header{background:#fff;border-bottom:1px solid #ddd;padding:14px 16px}
.bar,main{max-width:760px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}.add{background:#1a73e8;color:#fff}
main{padding:14px 14px 90px}.section{margin:18px 0}.section-title{font-size:14px;font-weight:700;margin-bottom:9px}
.high .section-title{color:#d93025}.medium .section-title{color:#b06000}.low .section-title{color:#188038}
.notes{display:grid;gap:9px}.empty{background:#fff;border:1px dashed #ccc;border-radius:12px;padding:15px;color:#777}
.note{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:13px}.note.done{opacity:.55}
.note-row{display:flex;gap:10px;align-items:flex-start}.check{width:20px;height:20px}.note-title{font-weight:700;flex:1}
.delete{background:#f1f3f4;color:#666;padding:6px 9px}.meta{font-size:12px;color:#777;margin:7px 0 0 30px}
.note-imgs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 30px}.note-imgs img{width:82px;height:82px;object-fit:cover;border-radius:8px}
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;font-size:27px;padding:0;box-shadow:0 4px 14px #0003}
.modal{display:none;position:fixed;inset:0;background:#0007;z-index:20;align-items:flex-end;justify-content:center}
.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;border-radius:18px 18px 0 0;padding:20px;max-height:92vh;overflow:auto}
input,textarea,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:5px 0 12px;font:inherit}
textarea{min-height:90px}.actions{display:flex;justify-content:flex-end;gap:10px}.cancel{background:#eee}
.preview{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.preview img{width:64px;height:64px;object-fit:cover;border-radius:8px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px;margin:20px}}
</style>
</head>
<body>
<header><div class="bar"><h1>🏦 Banking To-Do</h1><button class="add" id="addTop" type="button">＋ Add Note</button></div></header>
<main>
<section class="section high"><div class="section-title">🔴 HIGH PRIORITY</div><div id="high" class="notes"></div></section>
<section class="section medium"><div class="section-title">🟡 MEDIUM PRIORITY</div><div id="medium" class="notes"></div></section>
<section class="section low"><div class="section-title">🟢 LOW PRIORITY</div><div id="low" class="notes"></div></section>
<section class="section"><div class="section-title">📅 TODAY'S TASKS</div><div id="today" class="notes"></div></section>
<section class="section"><div class="section-title">📌 NOTES</div><div id="general" class="notes"></div></section>
<section class="section"><div class="section-title">⏰ REMINDERS</div><div id="reminders" class="notes"></div></section>
<section class="section"><div class="section-title">📋 FOLLOW-UP</div><div id="followup" class="notes"></div></section>
<section class="section"><div class="section-title">✅ COMPLETED</div><div id="completed" class="notes"></div></section>
</main>
<button class="add fab" id="addFab" type="button">＋</button>
<div class="modal" id="modal">
<div class="sheet">
<h2>New Note</h2>
<label>Title</label><input id="title" type="text" placeholder="Enter note title">
<label>Details / checklist</label><textarea id="details" placeholder="Enter details or tasks"></textarea>
<label>Priority</label><select id="priority"><option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">🟢 Low</option></select>
<label>Category</label><select id="category"><option value="today">📅 Today's Tasks</option><option value="general">📌 Notes</option><option value="reminders">⏰ Reminders</option><option value="followup">📋 Follow-up</option></select>
<label>Due date</label><input id="due" type="date">
<label>Attach images</label><input id="images" type="file" accept="image/*" multiple>
<div id="preview" class="preview"></div>
<div class="actions"><button class="cancel" id="cancel" type="button">Cancel</button><button class="add" id="save" type="button">Save Note</button></div>
</div></div>
<script src="app.js" defer></script>
</body></html>
